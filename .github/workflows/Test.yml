
name: Kalshi Bot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Python syntax
        run: |
          python -m compileall -q kalshi_bot

      - name: Run automated tests
        env:
          TRADING_MODE: paper
          LIVE_TRADING_ACK: "no"
        run: |
          python -m pytest -q
